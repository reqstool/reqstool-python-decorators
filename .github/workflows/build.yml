name: Build PyPI
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/python-lint.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/python-build-hatch.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0
    with:
      coverage-source: reqstool_python_decorators
      ref: ${{ inputs.ref }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      post-test-command: hatch run dev:python scripts/generate_annotations.py

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0
    with:
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build

  smoke:
    needs: build
    uses: reqstool/.github/.github/workflows/python-smoke.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0
    with:
      dist-artifact: ${{ inputs.artifact-name || 'dist' }}
      requirements: pytest==8.4.1
      command: pytest tests/unit tests/e2e

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1

  ci:
    if: ${{ always() }}
    needs: [lint, build, reqstool, smoke, validate-openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
